name: LCPortalCICD

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: CICD
    ports:
      - '42069:80'
    volumes:
      - ./:/var/www/html:delegated
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Browser terminals to client servers. Proxy /terminal/ws to it from the
  # host nginx (see terminal-gateway/README.md); it is not public otherwise.
  terminal-gateway:
    build:
      context: ./terminal-gateway
    container_name: CICD_Terminal
    ports:
      - '127.0.0.1:42071:8090'
    environment:
      LARAVEL_URL: http://backend
      TERMINAL_GATEWAY_SECRET: ${TERMINAL_GATEWAY_SECRET}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: CICD_Worker
    ports:
      - '42070:8080'
    volumes:
      - ./:/var/www/html:delegated
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/core/apps:/root/core/apps
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
