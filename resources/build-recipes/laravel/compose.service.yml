  {{slug}}:
    image: {{image}}
    container_name: {{container}}
    env_file:
      - {{env_file}}
    ports:
      - "127.0.0.1:{{host_port}}:{{container_port}}"
    volumes:
      - "{{storage_host}}:{{storage_container}}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - {{network}}
