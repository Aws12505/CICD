; Only used by the legacy `worker` role. Catalog processes replace it: each
; runs as its own container, so one crashing does not hide behind supervisord.

[program:laravel-scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --timeout=21600 --memory=1024
autostart=true
autorestart=true
user=www-data
stopwaitsecs=21630
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
